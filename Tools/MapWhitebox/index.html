<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>PICTOUR 地图白模生成器</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header>
		<div>
			<h1>地图白模生成器</h1>
			<p>生成一整张横板关卡轮廓。道路是等宽走廊串起来的主路；守林人小屋固定是三层，带地下室、二层阳台，阁楼在第三层上面靠中间；巨树高塔沿一条会左右错开的主路往上爬，途中分出纵向支路。机关、藤蔓和分层留到正式搭建时再加。</p>
		</div>
	</header>
	<main class="layout">
		<aside class="panel">
			<h2>生成</h2>
			<label for="layout">地形</label>
			<select id="layout">
				<option value="tower" selected>巨树高塔</option>
				<option value="hut">守林人小屋</option>
				<option value="road">道路</option>
			</select>
			<label for="seed">种子</label>
			<div class="seed-row">
				<input id="seed" type="number" min="1" max="999999999" value="661232">
				<button id="random-seed" class="secondary" type="button">随机</button>
			</div>
			<label id="length-label" for="length">攀爬层数</label>
			<input id="length" type="number" min="5" max="12" value="8">
			<label for="verticality">房间走势</label>
			<input id="verticality" type="range" min="0" max="100" value="35">
			<div class="range-ends"><span id="vert-left">路线更曲折</span><span id="vert-right">竖井更长</span></div>
			<div class="stack">
				<button id="generate" type="button">生成新地图</button>
				<button id="download-png" class="secondary" type="button">下载原型图</button>
				<button id="download-json" class="secondary" type="button">下载搭建数据</button>
			</div>
			<h2 style="margin-top: 22px">局部重绘</h2>
			<p class="note">单击一段轮廓，或拖拽框选几段。重绘只改这一块的形状，周围已经定下来的部分保持不动。</p>
			<div class="stack">
				<button id="redraw" class="secondary" type="button" disabled>重绘选区</button>
				<button id="clear-selection" class="secondary" type="button">清除选择</button>
				<button id="undo" class="secondary" type="button" disabled>撤销</button>
			</div>
			<p id="status" class="status"></p>
		</aside>
		<section class="panel stage">
			<canvas id="map"></canvas>
			<div class="legend">
				<span class="swatch"><i style="background:#5d86f2"></i>关卡轮廓</span>
				<span class="swatch"><i style="background:#f7f8ff"></i>外沿</span>
				<span class="swatch"><i style="background:#e7c36a"></i>选中</span>
			</div>
		</section>
	</main>
	<script src="mapgen.js?v=18"></script>
	<script src="app.js"></script>
</body>
</html>
